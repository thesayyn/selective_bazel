name: single runner

# The baseline: every test on one GitHub-hosted runner, with the remote cache.
# Tests already in the cache are skipped by Bazel itself; the rest run here,
# four at a time (ubuntu-latest has 4 cores).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      # Installs bazelisk and the Aspect CLI launcher (the CLI version is pinned
      # by .aspect/version.axl). The endpoints are in .bazelrc.
      - uses: aspect-build/setup-aspect@ebca96eb49ef58c00d4226de8bd3a0813507dd87 # v2026.38.3
        with:
          bazelrc-generate: false
      - name: Authenticate to the remote cache and BES
        env:
          ASPECT_API_TOKEN: ${{ secrets.ASPECT_API_TOKEN }}
        run: |
          {
            echo "build --remote_cache_header=X-Aspect=$ASPECT_API_TOKEN"
            echo "build --bes_header=X-Aspect=$ASPECT_API_TOKEN"
          } > user.bazelrc
      # Both pipelines run on every push, at the same time, against one cache.
      # Without this the shards' uploads would land while this job is still
      # working through its queue and it would take them as cache hits, which
      # makes it look faster than a single runner is. The env var enters every
      # action key, so this pipeline keeps its own cache namespace.
      - name: Keep a separate cache namespace from the sharded pipeline
        run: echo "build --action_env=PIPELINE=single-runner" >> user.bazelrc
      - name: Test everything
        run: bazel test //...
