name: sharded

# Ask the remote cache which tests are affected, then run only those, planned
# into shards of about SHARD_TARGET_SECONDS of test time each (every shard pays
# for checkout, install and analysis, so shards are sized to amortize that),
# never more than MAX_SHARDS (13 keeps a full run under GitHub's 20-concurrent-
# job limit for personal accounts). The `select` job executes no tests:
# `aspect cache diff` probes the cache with --experimental_remote_require_cached
# and reads the hit/miss map from Bazel's gRPC log.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  MAX_SHARDS: 13
  # Test time each shard is planned to hold; see tools/shard.py.
  SHARD_TARGET_SECONDS: 240

jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      count: ${{ steps.shard.outputs.count }}
      total: ${{ steps.shard.outputs.total }}
      matrix: ${{ steps.shard.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
      # Installs bazelisk and the Aspect CLI launcher (the CLI version is pinned
      # by .aspect/version.axl). The cache itself is configured in .bazelrc.
      - uses: aspect-build/setup-aspect@ebca96eb49ef58c00d4226de8bd3a0813507dd87 # v2026.38.3
        with:
          bazelrc-generate: false
      - name: Authenticate to the remote cache and BES
        env:
          ASPECT_API_TOKEN: ${{ secrets.ASPECT_API_TOKEN }}
        run: |
          {
            echo "build --remote_cache_header=X-Aspect=$ASPECT_API_TOKEN"
            echo "build --bes_header=X-Aspect=$ASPECT_API_TOKEN"
          } > user.bazelrc
      - name: Which tests are affected?
        # stdout is the JSON document; progress and per-target reasons go to stderr.
        # The probe executes nothing, so it has no build events worth streaming;
        # --bes_backend= switches BES off for this one invocation.
        run: aspect cache diff --output=json --bes_backend= //... > affected.json
      - name: Shard
        id: shard
        # Also writes the job summary (affected tests and their causes) when
        # GITHUB_STEP_SUMMARY is set.
        run: python3 tools/shard.py affected.json "$MAX_SHARDS" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: affected
          path: affected.json

  test:
    needs: select
    if: needs.select.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    name: test (${{ matrix.shard }})
    steps:
      - uses: actions/checkout@v6
      - uses: aspect-build/setup-aspect@ebca96eb49ef58c00d4226de8bd3a0813507dd87 # v2026.38.3
        with:
          bazelrc-generate: false
      - name: Authenticate to the remote cache and BES
        env:
          ASPECT_API_TOKEN: ${{ secrets.ASPECT_API_TOKEN }}
        run: |
          {
            echo "build --remote_cache_header=X-Aspect=$ASPECT_API_TOKEN"
            echo "build --bes_header=X-Aspect=$ASPECT_API_TOKEN"
          } > user.bazelrc
      - name: Test this shard
        run: bazel test ${{ matrix.targets }}
